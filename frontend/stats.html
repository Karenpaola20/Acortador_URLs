<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>URL Statistics</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>📊 URL Statistics</h1>

      <p class="subtitle">
        Enter the short code to view analytics.
      </p>

      <input
        type="text"
        id="codeInput"
        placeholder="Enter short code"
      >

      <button onclick="getStats()">
        Get Statistics Url
      </button>

      <div id="statsResult"></div>

      <a href="index.html" class="link-btn">
        ← Back to Shortener
      </a>

    </div>

  </div>

  <script src="stats.js"></script>

</body>
</html>
